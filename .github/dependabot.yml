# Dependabot: one grouped upgrade PR per ecosystem each month, and grouped
# security fixes as they come. Python major versions are left out of the
# grouped PR and arrive as their own PRs, so each can be reviewed for breaking
# changes. GitHub Actions majors stay in the grouped PR: they rarely need
# changes and CI exercises them. PRs are labelled like the rest of the repo
# and merge like any other PR once `test` passes.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python-version-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-security-updates:
        applies-to: security-updates
        patterns: ["*"]
    labels: ["chore", "priority: low"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-version-updates:
        applies-to: version-updates
        patterns: ["*"]
      actions-security-updates:
        applies-to: security-updates
        patterns: ["*"]
    labels: ["chore", "priority: low"]
    commit-message:
      prefix: chore
      include: scope
