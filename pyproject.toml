[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bestyet"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.1.3",
  "httpx>=0.28.1",
  "tzdata",
]

[project.scripts]
bestyet-init = "bestyet.init_grist:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.17.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bestyet = ["templates/*", "static/*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a Grist TEST document; skipped unless enabled"]
