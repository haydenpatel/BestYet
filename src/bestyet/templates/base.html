<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}BestYet{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <script src="{{ url_for('static', filename='loading.js') }}"></script>
</head>
<body>
  <div class="progress" aria-hidden="true"></div>
  <p class="visually-hidden" role="status" data-loading-status></p>
  <header>
    <h1>{% block heading %}BestYet{% endblock %}</h1>
  </header>
  <main>
    {% block body %}{% endblock %}
  </main>
  <nav class="tabs" aria-label="Main">
    <a href="{{ url_for('home') }}"{% if request.endpoint == 'home' %} aria-current="page"{% endif %}>Personal Bests</a>
  </nav>
</body>
</html>
